<div class="login-page">
    <div class="login-card">
        <div class="brand">
            <div class="brand-image">
                <img src="image.png" alt="Logo Sodería">
            </div>
            <h1>Sodería</h1>
            <p class="brand-subtitle">Panel de gestión interna</p>
        </div>

        <form (ngSubmit)="onSubmit()">
            <div class="input-group-custom">
                <label for="username">Usuario</label>
                <div class="input-wrap">
                    <i class="bi bi-person"></i>
                    <input id="username" type="text" [(ngModel)]="username" name="username" autocomplete="username"
                        placeholder="Tu usuario" />
                </div>
            </div>

            <div class="input-group-custom">
                <label for="password">Contraseña</label>
                <div class="input-wrap">
                    <i class="bi bi-lock"></i>
                    <input id="password" [type]="mostrarPassword() ? 'text' : 'password'" [(ngModel)]="password"
                        name="password" autocomplete="current-password" placeholder="Tu contraseña" />
                    <button type="button" class="btn-toggle-pass" (click)="togglePassword()"
                        [attr.aria-label]="mostrarPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                        <i class="bi" [class.bi-eye]="!mostrarPassword()" [class.bi-eye-slash]="mostrarPassword()"></i>
                    </button>
                </div>
            </div>

            @if (error()) {
            <div class="form-error">
                <i class="bi bi-exclamation-circle"></i> {{ error() }}
            </div>
            }

            <button type="submit" class="btn-submit" [disabled]="cargando()">
                {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
            </button>
            <a routerLink="/recuperar-password" class="link-olvide">¿Olvidaste tu contraseña?</a>
        </form>
    </div>
</div>
