<div class="login-page">
    <div class="login-card">
        <div class="brand">
            <div class="brand-image">
                <img src="image.png" alt="Logo Sodería">
            </div>
            <h1>Nueva contraseña</h1>
            <p class="brand-subtitle">Ingresá tu nueva clave de acceso</p>
        </div>

        @if (exito()) {
        <div class="success-block">
            <i class="bi bi-check-circle"></i>
            <p>Contraseña actualizada. Redirigiendo al login...</p>
        </div>
        } @else {
        <form (ngSubmit)="guardar()">
            <div class="input-group-custom">
                <label for="passwordNueva">Nueva contraseña</label>
                <div class="input-wrap">
                    <i class="bi bi-lock"></i>
                    <input id="passwordNueva" type="password" [(ngModel)]="passwordNueva" name="passwordNueva"
                        autocomplete="new-password" placeholder="Mínimo 6 caracteres" />
                </div>
            </div>

            <div class="input-group-custom">
                <label for="passwordConfirmar">Confirmar contraseña</label>
                <div class="input-wrap">
                    <i class="bi bi-lock"></i>
                    <input id="passwordConfirmar" type="password" [(ngModel)]="passwordConfirmar"
                        name="passwordConfirmar" autocomplete="new-password" placeholder="Repetir contraseña" />
                </div>
            </div>

            @if (error()) {
            <div class="form-error">
                <i class="bi bi-exclamation-circle"></i> {{ error() }}
            </div>
            }

            <button type="submit" class="btn-submit" [disabled]="guardando() || !token">
                {{ guardando() ? 'Guardando...' : 'Restablecer contraseña' }}
            </button>

            <a routerLink="/login" class="link-volver">Volver al login</a>
        </form>
        }
    </div>
</div>
