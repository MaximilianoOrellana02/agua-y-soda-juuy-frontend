<div class="login-page">
    <div class="login-card">
        <div class="brand">
            <div class="brand-image">
                <img src="image.png" alt="Logo Sodería">
            </div>
            <h1>Recuperar contraseña</h1>
            <p class="brand-subtitle">Te mandamos un link para restablecerla</p>
        </div>

        @if (enviado()) {
        <div class="success-block">
            <i class="bi bi-envelope-check"></i>
            <p>Si el email está registrado, te va a llegar un mensaje con las instrucciones en unos minutos.</p>
            <a routerLink="/login" class="btn-submit-link">Volver al login</a>
        </div>
        } @else {
        <form (ngSubmit)="enviar()">
            <div class="input-group-custom">
                <label for="email">Email</label>
                <div class="input-wrap">
                    <i class="bi bi-envelope"></i>
                    <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="tu@email.com"
                        autocomplete="email" />
                </div>
            </div>

            @if (error()) {
            <div class="form-error">
                <i class="bi bi-exclamation-circle"></i> {{ error() }}
            </div>
            }

            <button type="submit" class="btn-submit" [disabled]="enviando()">
                {{ enviando() ? 'Enviando...' : 'Enviar instrucciones' }}
            </button>

            <a routerLink="/login" class="link-volver">Volver al login</a>
        </form>
        }
    </div>
</div>
