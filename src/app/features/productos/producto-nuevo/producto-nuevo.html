<div class="page">
    <header class="page-header">
        <a routerLink="/productos" class="btn-icon" aria-label="Volver">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h1>Nuevo producto</h1>
        <span class="btn-icon-spacer"></span>
    </header>

    <form class="fields-card" (ngSubmit)="guardar()">
        <div class="form-group">
            <label for="nombre">Nombre del producto *</label>
            <input id="nombre" type="text" [(ngModel)]="form.nombre" name="nombre" placeholder="Ej: Agua 20L" />
        </div>

        <div class="form-group checkbox-group">
            <div class="checkbox-info">
                <label for="esRetornable" class="label-retornable">¿Es retornable?</label>
                <span class="checkbox-desc">Se prestan y devuelven envases vacíos</span>
            </div>
            <label class="switch">
                <input id="esRetornable" type="checkbox" [(ngModel)]="form.esRetornable" name="esRetornable" />
                <span class="slider"></span>
            </label>
        </div>

        <div class="form-group">
            <label for="precioParticular">Precio *</label>
            <input id="precioParticular" type="number" min="0" step="0.01" [(ngModel)]="form.precioParticular"
                name="precioParticular" placeholder="0.00" />
        </div>

        @if (error()) {
        <div class="form-error">
            <i class="bi bi-exclamation-circle"></i> {{ error() }}
        </div>
        }

        <div class="form-actions">
            <a routerLink="/productos" class="btn-cancel">Cancelar</a>
            <button type="submit" class="btn-save" [disabled]="guardando()">
                {{ guardando() ? 'Guardando...' : 'Crear producto' }}
            </button>
        </div>
    </form>
</div>
