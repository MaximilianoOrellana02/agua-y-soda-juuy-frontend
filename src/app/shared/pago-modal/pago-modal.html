<div class="backdrop" (click)="cerrar.emit()"></div>

<div class="sheet">
    <div class="sheet-handle"></div>

    <div class="sheet-header">
        <h2>Registrar pago</h2>
        <button class="btn-close" (click)="cerrar.emit()" aria-label="Cerrar">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <p class="saldo-info">
        Saldo actual: <strong>${{ saldoActual() }}</strong>
    </p>

    <div class="form-group">
        <label>Monto pagado</label>
        <input type="number" min="0" step="0.01" [(ngModel)]="monto" name="monto" />
    </div>

    <div class="metodo-chips">
        <button type="button" class="metodo-chip" [class.active]="metodoPago() === 'efectivo'"
            (click)="metodoPago.set('efectivo')">
            <i class="bi bi-cash"></i> Efectivo
        </button>
        <button type="button" class="metodo-chip" [class.active]="metodoPago() === 'transferencia'"
            (click)="metodoPago.set('transferencia')">
            <i class="bi bi-bank"></i> Transferencia
        </button>
    </div>

    <div class="form-group">
        <label>Observación (opcional)</label>
        <input type="text" [(ngModel)]="observacion" name="observacion" placeholder="Ej: Pagó en el local" />
    </div>

    @if (error()) {
    <div class="form-error">
        <i class="bi bi-exclamation-circle"></i> {{ error() }}
    </div>
    }

    <button class="btn-confirmar" [disabled]="guardando()" (click)="confirmar()">
        {{ guardando() ? 'Registrando...' : 'Confirmar pago' }}
    </button>
</div>
