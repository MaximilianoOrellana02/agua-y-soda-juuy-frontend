<div class="shell">
    <header class="navbar">
        <div class="navbar-brand">
            <a class="navbar-icon" routerLink="/" style="cursor: pointer;">
                <img src="image.png" alt="Logo" width="62px">
            </a>
            <div class="navbar-text">
                <span class="navbar-title">Sodería</span>
                @if (authService.usuarioActual(); as usuario) {
                <span class="navbar-user">{{ usuario.nombreCompleto }}</span>
                }
            </div>
        </div>

        <div class="navbar-actions">
            <button class="btn-icon-nav" (click)="abrirConfiguracion()" aria-label="Configuración">
                <i class="bi bi-gear"></i>
            </button>
        </div>
    </header>

    <main class="shell-content">
        <router-outlet></router-outlet>
    </main>


    <nav class="bottom-nav">
        <a routerLink="/hoy" routerLinkActive="active" class="nav-item">
            <i class="bi bi-sun-fill"></i>
            <span>Hoy</span>
        </a>
        <a routerLink="/clientes" routerLinkActive="active" class="nav-item">
            <i class="bi bi-people-fill"></i>
            <span>Clientes</span>
        </a>
        <a routerLink="/productos" routerLinkActive="active" class="nav-item">
            <i class="bi bi-box-seam-fill"></i>
            <span>Productos</span>
        </a>
        <a routerLink="/historial" routerLinkActive="active" class="nav-item">
            <i class="bi bi-clock-history"></i>
            <span>Historial</span>
        </a>
    </nav>
</div>
@if (mostrarConfiguracion()) {
<app-settings-modal (cerrar)="cerrarConfiguracion()"></app-settings-modal>
}
